<html lang="en"><head><meta charset="utf-8">

<title>KPM Beranang 3D Map Component</title>
<style>
:root{--ink:#26302f;--mute:#6c7a78;--acc:#002147;--panel:rgba(255,255,255,.94);--line:#dfe4e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--ink:#26302f}}
html,body{height:100%;margin:0;background:#e9edef;color:var(--ink);font:14px/1.4 "Trebuchet MS",Verdana,sans-serif;overflow:hidden}
canvas{display:block;touch-action:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 18px rgba(30,50,50,.12)}
#title{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:10px 14px}
#title b{font-size:16px}#title span{display:block;color:var(--mute);font-size:12px}
#list{position:fixed;left:12px;top:calc(70px + env(safe-area-inset-top,0px));width:200px;max-height:48vh;overflow:auto;padding:6px}
#list button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:5px 8px;border-radius:6px;font:inherit;cursor:pointer}
#list button:hover,#list button:focus-visible{background:#d6e3ff;outline:none}
#right{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:64px;display:flex;flex-direction:column;gap:8px}
#here{height:70px;border:0;color:var(--ink);font:700 10px/1.2 "Trebuchet MS",Verdana,sans-serif;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;cursor:pointer}
.fl{height:36px;border:0;border-radius:9px;font:inherit;font-size:17px;cursor:pointer;color:var(--ink)}
.fl.on{background:var(--acc);color:#fff;font-weight:700}
.fl:focus-visible,#bar button:focus-visible{outline:2px solid #708ab5}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;padding:6px}
#bar button{background:#f1f4f3;border:1px solid var(--line);color:var(--ink);padding:7px 12px;border-radius:8px;font:inherit;cursor:pointer}
#bar button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#info{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(62px + env(safe-area-inset-bottom,0px));max-width:320px;padding:10px 14px;display:none;text-align:center}
#info h3{margin:0 0 2px;font-size:15px;color:var(--acc)}#info p{margin:0}
.lab{position:fixed;left:0;top:0;white-space:nowrap;font-size:11px;padding:2px 8px;border-radius:20px;background:#fff;color:var(--ink);border:1px solid #cfd6d5;box-shadow:0 2px 6px rgba(0,0,0,.18);cursor:pointer}
.lab::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin-right:5px}
.lab:hover{background:var(--acc);color:#fff}
@media(max-width:700px){#list{display:none}}

/* Embedded map component: retain only the 3D campus map, not the Wayfinder page UI. */

body>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#title,#list,#right,#info,#bar{display:none!important}

// API bridge for the CAMPUS_MAP template controls (the template UI remains the visible UI).
window._kpmbScene = {
  toggleSpin: function(state) {
    if (typeof state === 'boolean') { auto = state; bRot.classList.toggle('on', auto); }
    else { auto = !auto; bRot.classList.toggle('on', auto); }
    return auto;
  },
  resetView: function() { bReset.click(); },
  focusBuilding: function(name) {
    const term = String(name || '').toLowerCase();
    const aliases = {
       'kamsis al-farabi':'kamsis farabi',
       'perpustakaan kpmb':'library',
       'surau an-nur kpmb beranang':'surau an-nur',
       'blok m (dewan kuliah & makmal komputer)':'block m',
       'blok i (blok akademik & bengkel)':'block i',
       'blok pembangunan pelajar':'block pembangunan pelajar',
       'padang bola sepak & trek balapan':'padang',
       'pejabat':'pejabat',
       'café':'café'
     };
     const target = aliases[term] || term;
     const label = labels.find(l => l.name.toLowerCase() === target ||
       l.name.toLowerCase().includes(target) || target.includes(l.name.toLowerCase()));
    if (label) { focus(label); return true; }
    return false;
  },
  setSpeed: function(val) {
     const rates = { slow: 0.0015, normal: 0.0035, fast: 0.007 };
     spinRate = rates[String(val).toLowerCase()] || (Number(val) || 0.0035);
   },
  setPerspective: function(mode) {
    if (mode === 'birds_eye' || mode === 'top') bTop.click();
    else if (mode === 'isometric') { goal.ph = 0.75; goal.r = 46; }
    else if (mode === 'pedestrian') { goal.ph = 1.25; goal.r = 24; }
  },
  showDirections: function(name) { return this.focusBuilding(name); }
};
